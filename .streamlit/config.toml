[server]
enableStaticServing = true
maxUploadSize = 10
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true

[theme]
base = "light"
primaryColor = "#333333"
backgroundColor = "#F3F3F3"
secondaryBackgroundColor = "#F7F7F7"
textColor = "#222222"
linkColor = "#222222"
linkUnderline = false
borderColor = "#DDDDDD"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "3px"
buttonRadius = "2px"
baseFontSize = 15
font = "Jost:https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap"
headingFont = "'Cormorant Garamond':https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeBackgroundColor = "#F7F7F7"
grayColor = "#777777"
greenColor = "#3D6B4F"
redColor = "#9A3B3B"
chartCategoricalColors = ["#333333", "#777777", "#AAAAAA", "#555555", "#999999", "#CCCCCC", "#222222"]
chartSequentialColors = ["#F3F3F3", "#E0E0E0", "#CCCCCC", "#B3B3B3", "#999999", "#808080", "#666666", "#4D4D4D", "#333333", "#1A1A1A"]
dataframeBorderColor = "#DDDDDD"
dataframeHeaderBackgroundColor = "#F7F7F7"

[theme.sidebar]
backgroundColor = "#252525"
secondaryBackgroundColor = "#303030"
textColor = "#E6E6E6"
borderColor = "#3A3A3A"
primaryColor = "#FFFFFF"
linkColor = "#E6E6E6"
codeBackgroundColor = "#303030"
